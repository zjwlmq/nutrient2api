services:
  nutrient2api:
    build: .
    image: nutrient2api:local
    restart: unless-stopped
    init: true
    environment:
      NUTRIENT_API_KEY: ${NUTRIENT_API_KEY:-}
      NUTRIENT2API_TOKEN: ${NUTRIENT2API_TOKEN:-}
      NUTRIENT2API_HOST: 0.0.0.0
      NUTRIENT2API_PORT: "8787"
      NUTRIENT2API_DATA_DIR: /app/data
      NUTRIENT_BASE_URL: ${NUTRIENT_BASE_URL:-https://api.nutrient.io/ai/v1}
      NUTRIENT2API_MAX_BODY_BYTES: ${NUTRIENT2API_MAX_BODY_BYTES:-10485760}
      NUTRIENT2API_CLIENT_TIMEOUT: ${NUTRIENT2API_CLIENT_TIMEOUT:-30}
      NUTRIENT2API_MAX_CONNECTIONS: ${NUTRIENT2API_MAX_CONNECTIONS:-32}
      NUTRIENT2API_QUIET: ${NUTRIENT2API_QUIET:-}
      NUTRIENT2API_SYSTEM_PROMPT: ${NUTRIENT2API_SYSTEM_PROMPT:-}
      NUTRIENT2API_SYSTEM_PROMPT_FILE: ${NUTRIENT2API_SYSTEM_PROMPT_FILE:-}
      NUTRIENT2API_DROP_CALLER_SYSTEM: ${NUTRIENT2API_DROP_CALLER_SYSTEM:-}
      NUTRIENT2API_ASSERT_AUTHORITY: ${NUTRIENT2API_ASSERT_AUTHORITY:-}
      NUTRIENT2API_SUPPRESS_CLAIM: ${NUTRIENT2API_SUPPRESS_CLAIM:-}
    volumes:
      - nutrient2api_data:/app/data
    ports:
      - "127.0.0.1:${NUTRIENT2API_PUBLISH_PORT:-8787}:8787"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nutrient2api_data:
